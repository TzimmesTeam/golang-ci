name: Container

on:
  workflow_call:
    inputs:
      main-package:
        required: true
        type: string
      go-version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          build-args: |
            GO_VERSION=${{ inputs.go-version }}
            MAIN_PACKAGE=${{ inputs.main-package }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true

